# frozen packet: BetterTogether::Seed envelope, loaded with Seed.load_seed / Seed.import_or_update!
# The purchase agreements a platform needs before it can sell: what a buyer accepts for a subscription, a one-time
# purchase (tickets and exchanges too) and a payment made outside the platform (cash, cheque, e-transfer), and which
# purchases each one covers. Planted by Billing::PurchaseAgreementSeeds from the seed catalog, or by the agreement
# builder for the host platform.
#
# Every agreement is planted as a DRAFT carrying the placeholder text below, so nothing can be sold until a steward
# writes the real terms and activates it (see Checkout::AgreementGate). Planting again only creates what is missing and
# never touches an agreement a steward has edited or activated.
#
# The es, fr and uk wording wants a translator's review before an agreement is activated.

better_together:
  version: "1.0"
  seed:
    type: "BetterTogether::Seed"
    identifier: "billing_purchase_agreements"
    created_by: "Better Together Solutions"
    created_at: "2026-11-10T12:00:00Z"
    description: >
      Draft subscription, one-time purchase and offline payment agreements with placeholder text, and the purchases
      each one is required for.
    origin:
      platforms:
        - name: "Community Engine"
          version: "1.0"
          url: "https://bebettertogether.ca"
      contributors:
        - name: "Better Together Solutions"
          role: "Creator"
      license: "LGPLv3"
      usage_notes: >
        The text is a placeholder. Replace it with your own terms before activating an agreement.

  purchase_agreements:
    placeholder:
      en: This is placeholder text. Replace it with your own terms, then set the agreement to active.
      es: Este es un texto provisional. Sustitúyalo por sus propios términos y luego active el acuerdo.
      fr: Ceci est un texte provisoire. Remplacez-le par vos propres conditions, puis activez l'accord.
      uk: Це тимчасовий текст. Замініть його власними умовами, а потім активуйте угоду.
    agreements:
    - identifier: subscription_agreement
      title:
        en: Subscription Agreement
        es: Acuerdo de suscripción
        fr: Accord d'abonnement
        uk: Угода про підписку
      description:
        en: 'Terms for subscriptions and memberships: what you receive, how renewal works, and how to cancel.'
        es: 'Términos de las suscripciones y membresías: qué recibe, cómo funciona la renovación y cómo cancelar.'
        fr: 'Conditions des abonnements et adhésions : ce que vous recevez, le fonctionnement du renouvellement et l''annulation.'
        uk: 'Умови підписок і членства: що ви отримуєте, як працює поновлення та як скасувати.'
    - identifier: one_time_purchase_agreement
      title:
        en: One-Time Purchase Agreement
        es: Acuerdo de compra única
        fr: Accord d'achat unique
        uk: Угода про разову покупку
      description:
        en: 'Terms for one-time purchases, event tickets and exchanges: what you receive and how refunds work.'
        es: 'Términos de las compras únicas, entradas a eventos e intercambios: qué recibe y cómo funcionan los reembolsos.'
        fr: 'Conditions des achats uniques, billets et échanges : ce que vous recevez et le fonctionnement des remboursements.'
        uk: 'Умови разових покупок, квитків на події та обмінів: що ви отримуєте і як працюють повернення коштів.'
    - identifier: offline_payment_terms
      title:
        en: Payment Outside the Platform
        es: Pago fuera de la plataforma
        fr: Paiement hors de la plateforme
        uk: Оплата поза платформою
      description:
        en: 'Terms for paying by cash, cheque or e-transfer: the payment goes straight to the seller, and the platform cannot track or protect it.'
        es: 'Términos para pagar en efectivo, con cheque o por transferencia electrónica: el pago va directamente al vendedor y la plataforma no puede rastrearlo ni protegerlo.'
        fr: 'Conditions du paiement comptant, par chèque ou par virement : le paiement va directement au vendeur et la plateforme ne peut ni le suivre ni le protéger.'
        uk: 'Умови оплати готівкою, чеком або електронним переказом: платіж іде безпосередньо продавцю, а платформа не може його відстежити чи захистити.'
    requirements:
    - agreement: subscription_agreement
      purpose: subscription
    - agreement: one_time_purchase_agreement
      purpose: one_time
    - agreement: one_time_purchase_agreement
      purpose: ticket
    - agreement: one_time_purchase_agreement
      purpose: exchange
    - agreement: offline_payment_terms
      payment_method: cash
    - agreement: offline_payment_terms
      payment_method: cheque
    - agreement: offline_payment_terms
      payment_method: etransfer
