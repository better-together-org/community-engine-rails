# frozen packet: BetterTogether::Seed envelope, loaded with Seed.load_seed / Seed.import_or_update!
# Canadian sales tax as data: one zone per province or territory, with the rates that apply there today.
# Planted by Billing::Tax::Seeds::Planter, which only adds what is missing and never changes a rate that exists (a rate
# that moves is a new row with its own dates, so orders already placed keep the rate they were charged).
#
# Names and labels carry a value per locale (en, es, fr, uk). The es, fr and uk wording, the French tax
# abbreviations in particular (TPS, TVH, TVQ, TVP, TVD), wants a translator's review.
#
# Every figure below comes from an official government page, read in November 2026. The date after each
# link is the one the page itself shows ("Date modified", "Last updated" or "Revised"), or says so when
# the page shows none. Check the pages again before relying on a figure after those dates.
#
# GST/HST rates, by province and territory (CRA, "GST/HST calculator (and rates)", table "On or after
# April 1, 2025", which also gives the PST/QST column used below). Date modified: 2025-04-01.
#   https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html
#   GST 5% is the rate where the province does not take part in the HST; HST is 13% in Ontario, 14% in Nova
#   Scotia (down from 15% on April 1, 2025) and 15% in New Brunswick, Newfoundland and Labrador and
#   Prince Edward Island. The same table lists the QST at 9.975%, the British Columbia and Manitoba PST/RST
#   at 7% and the Saskatchewan PST at 6%.
#
# Basic groceries are zero-rated for GST/HST in every province and territory (CRA, "Which rate to
# charge"). Page details date: 2026-04-08 (the page shows the date without a label).
#   https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate.html
#
# British Columbia PST, 7% "generally" (Province of B.C., "Provincial Sales Tax (PST)"). Last updated on
# September 21, 2026. Food for human consumption, such as basic groceries, is exempt (same site,
# "PST exemptions", last updated on August 20, 2025).
#   https://www2.gov.bc.ca/gov/content/taxes/sales-taxes/pst
#   https://www2.gov.bc.ca/gov/content/taxes/sales-taxes/pst/exemptions
#
# Saskatchewan PST, 6% (Government of Saskatchewan, "Provincial Sales Tax"). The page shows no date.
#   https://www.saskatchewan.ca/business/taxes-licensing-and-reporting/provincial-taxes-policies-and-bulletins/provincial-sales-tax
#
# Manitoba RST, 7%, worked out on the selling price before GST (Manitoba Finance, "Retail Sales Tax").
# The page shows no date. Basic groceries and most other food are exempt (Information Bulletin RST 030,
# Revised: July 2026).
#   https://www.gov.mb.ca/finance/taxation/taxes/retail.html
#   https://www.gov.mb.ca/finance/taxation/pubs/bulletins/030.pdf
#
# Quebec QST, 9.975% "on the selling price excluding the GST", GST 5% on the selling price (Revenu Quebec,
# "Basic Rules for Applying the GST/HST and QST"; page last updated 2021-04-12). The rate history table
# shows 9.975% from January 1, 2013 to the present (same site, "Tables of GST and QST Rates", last
# updated 2021-04-12). Sales of basic groceries are zero-rated for the QST (same site, "Zero-Rated
# Supplies", last updated 2026-07-21). Revenu Quebec refuses plain automated reads (HTTP 403), so these
# pages were read with the repo's Camoufox browser session at a slow, one-page-at-a-time pace.
#   https://www.revenuquebec.ca/en/businesses/consumption-taxes/gsthst-and-qst/basic-rules-for-applying-the-gsthst-and-qst/
#   https://www.revenuquebec.ca/en/businesses/consumption-taxes/gsthst-and-qst/basic-rules-for-applying-the-gsthst-and-qst/tables-of-gst-and-qst-rates/
#   https://www.revenuquebec.ca/en/businesses/consumption-taxes/gsthst-and-qst/basic-rules-for-applying-the-gsthst-and-qst/types-of-supplies/zero-rated-supplies/
#
# Saskatchewan groceries: basic groceries are exempt from PST, and food and drink are taxed for PST when
# they are taxed for GST. Even a GST small supplier of taxable food or drink must hold a PST licence
# (Information Bulletin PST-2, "Grocery, Convenience and Drug Stores", Revised: March 2025).
#   https://sets.saskatchewan.ca/rptp/wcm/connect/94a41317-34b9-46bf-9758-c27b18ee4b31/PST.002+Grocery+Convenience+and+Drug+Stores.pdf
#
# Platform operators, GST/HST (CRA, "GST/HST for digital-economy businesses", measures in effect July 1, 2021,
# Excise Tax Act sections 211.21 and 211.25). A distribution platform operator is a person, other than the
# supplier, who controls or sets the essential elements of the transaction or, failing that, is involved in
# collecting the consideration and passing it to the supplier; a person who solely lists or advertises, or is
# solely a payment processor, is excluded. A registered operator, resident or not, must charge and collect
# GST/HST on the final sale price of "qualifying goods" (goods to be delivered in Canada, other than exempt or
# zero-rated supplies and goods couriered from outside Canada) sold through its platform by vendors NOT
# registered for the GST/HST, a Canadian small supplier included, and not on its own platform fees. A vendor
# who is registered stays responsible for its own sales. For digital products and services the rule reaches
# only non-resident suppliers. The CRA does not currently require the information returns from Budget 2021.
# Page dates: "How to charge and collect the tax" 2025-10-16; "Supply of qualifying goods in Canada" 2024-10-16;
# "Notification and information reporting" 2025-10-16; "Definitions" 2026-06-18.
#   https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/digital-economy-gsthst/charge-collect/sales-good.html
#   https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/digital-economy-gsthst/charge-collect/cross-border.html
#   https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/digital-economy-gsthst/notification-information-reporting.html
#   https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/digital-economy-gsthst/digital-economy-definitions.html
#
# Platform operators, QST (Revenu Quebec, "Collecting the QST", suppliers outside Quebec; the page shows no
# date; read November 2026 with the Camoufox session). An operator of a distribution platform registered under
# the general QST system must collect the QST on corporeal movable property delivered in Quebec that is
# supplied through its platform by anyone not registered under the general QST system, and on incorporeal
# movable property or services supplied in Quebec through its platform by suppliers outside Quebec who are not
# registered under the general system. A buyer is a specified Quebec consumer when its usual place of residence
# is in Quebec, shown by any two of: billing address, home address, business address, IP address or other
# geolocation, payment information, SIM information, landline location, or other relevant information.
# The Revenu Quebec screening questionnaires for platform operators were not completed.
#   https://www.revenuquebec.ca/en/businesses/consumption-taxes/gsthst-and-qst/special-cases-gsthst-and-qst/suppliers-outside-quebec/collecting-the-qst/
#
# The basic groceries category is therefore untaxed everywhere: every page above says so for its tax.

