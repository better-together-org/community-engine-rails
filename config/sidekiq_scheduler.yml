"better_together:metrics:link_checker_weekly":
  cron: "0 2 * * 1" # weekly on Mondays at 02:00 UTC
  class: "BetterTogether::Metrics::LinkCheckerReportSchedulerJob"
  queue: "metrics"
  description: "Generate Link Checker weekly report and email it to the app from-address (only sends if there are new broken links)"

"better_together:metrics:orphaned_link_cleanup_monthly":
  cron: "0 3 1 * *" # monthly on the 1st at 03:00 UTC
  class: "BetterTogether::Metrics::OrphanedRichTextLinkCleanupJob"
  queue: "maintenance"
  description: "Remove orphaned RichTextLink records where the associated record has been deleted"

"better_together:event_reminder_scan_hourly":
  cron: "0 * * * *" # hourly
  class: "BetterTogether::EventReminderScanJob"
  queue: "notifications"
  description: "Scan upcoming events and schedule per-event reminders"

"better_together:event_next_occurrence_refresh_scan_hourly":
  cron: "5 * * * *" # hourly at :05 UTC
  class: "BetterTogether::EventNextOccurrenceRefreshScanJob"
  queue: "maintenance"
  description: "Advance next_occurrence_at for recurring events whose stored value has passed"

"better_together:federated_sync_scan_hourly":
  cron: "15 * * * *" # hourly at :15 UTC
  class: "BetterTogether::FederatedSyncScanJob"
  queue: "platform_sync"
  description: "Scan active federated platform connections and enqueue content pull jobs"

"better_together:federated_linked_seed_sync_scan_hourly":
  cron: "20 * * * *" # hourly at :20 UTC
  class: "BetterTogether::FederatedLinkedSeedSyncScanJob"
  queue: "platform_sync"
  description: "Scan active linked private grants and enqueue recipient-scoped linked seed pulls"

"better_together:federation_access_token_purge_daily":
  cron: "0 1 * * *" # daily at 01:00 UTC
  class: "BetterTogether::FederationAccessTokenPurgeJob"
  queue: "maintenance"
  description: "Purge revoked and expired federation access tokens to prevent unbounded table growth"

"better_together:sitemap_refresh_daily":
  cron: "0 2 * * *" # daily at 02:00 UTC
  class: "BetterTogether::SitemapRefreshScanJob"
  queue: "maintenance"
  description: "Regenerate per-platform XML sitemaps for all locally-hosted platforms"

# Billing jobs name no `queue:` on purpose. sidekiq-scheduler enqueues an ActiveJob class
# with `enqueue(queue: <this value>)`, which sets the queue name literally and skips the
# host's queue_name_prefix, so a prefixed host would never see the job. Leaving it out lets
# BetterTogether::Billing::ApplicationJob (queue_as :billing) decide, prefix included.
"better_together:billing:redact_expired_event_payloads_daily":
  cron: "20 4 * * *" # daily at 04:20 UTC
  class: "BetterTogether::Billing::RedactExpiredEventPayloadsJob"
  description: "Redact retained billing event payloads after the replay window expires"

"better_together:billing:dead_letter_stale_events_hourly":
  cron: "15 * * * *" # hourly at :15 UTC
  class: "BetterTogether::Billing::DeadLetterStaleBillingEventsJob"
  description: "Promote exhausted or stale billing events into a dead-letter state for operator review"

"better_together:billing:prune_stale_pay_webhooks_daily":
  cron: "40 4 * * *" # daily at 04:40 UTC
  class: "BetterTogether::Billing::PruneStalePayWebhooksJob"
  description: "Delete Pay webhook deliveries that were never processed once the replay window has passed"

"better_together:billing:expire_orders_hourly":
  cron: "10 * * * *" # hourly at :10 UTC
  class: "BetterTogether::Billing::ExpireOrdersJob"
  description: "Let orders that were not paid in time lapse and release what they held"
