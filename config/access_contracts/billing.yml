controller_allowlist: {}
decisions:
  BL-1:
    kind: known_deviation
    title: Platform operators read buyers financial records
    app_does: Managers and stewards of a platform can read the orders, refund requests, credit accounts, offline payments, subscriptions, entitlements, billing events and billing reports of what that platform
      sells.
    privacy_rule: No standing role reads personal or financial records; support needs a separate audited grant.
    source: Found by this contract. Running a store means seeing sales, so the operate path stays until an audited grant exists.
resources:
  billing_agreement_requirement:
    model: BetterTogether::Billing::AgreementRequirement
    policy: BetterTogether::Billing::AgreementRequirementPolicy
    classification: system
    title: Billing agreement requirement
    states:
    - any
    - new
    - own_platform
    - other_platform
    permissions:
    - manage_platform
    controllers: []
    rules:
    - id: platform_operate
      question: Is the actor a platform manager or steward of the platform that owns the record?
      on_yes: allow
    - id: default_deny
      question: Nothing above matched
      on_yes: deny
    actions:
      index:
        states:
        - any
        rows:
        - personas:
          - anonymous
          - signed_in_non_member
          - community_member
          - community_contributor
          - community_organizer
          outcome: deny
          reason: Needs platform billing authority, an account or ownership this person does not hold.
          rule: default_deny
        - personas:
          - platform_manager
          - platform_steward
          outcome: allow
          rule: platform_operate
          reason: Managers and stewards operate the agreement requirement of their own platform.
        - personas:
          - record_owner
          - blocked_user
          outcome: na
      create:
