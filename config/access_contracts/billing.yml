subsystem: billing
title: Billing
summary: Plans, products, prices, orders, subscriptions, refunds and the platform billing screens.
policy_pattern: ^billing/|^metrics/billing_
deferred_policies:
  Billing::Owner: Abstract base that holds the tenant question; every policy below inherits it.
