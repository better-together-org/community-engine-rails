# Access contract: people subsystem (pilot).
# See communities.yml for how rows are matched.
subsystem: people
title: People
summary: Person profiles, the blocks people place on each other, and the contact details attached to them.

policy_pattern: person|contact_detail|email_address|phone_number|address|social_media
deferred_policies:
  Address: Contact component carrying its own privacy; next pilot stage.
  EmailAddress: Contact component carrying its own privacy; next pilot stage.
  PhoneNumber: Contact component carrying its own privacy; next pilot stage.
  SocialMediaAccount: Contact component carrying its own privacy; next pilot stage.
  PersonAccessGrant: Feature-flagged grant flow; contract with the break-glass design.
  PersonLink: Profile links; next pilot stage.
  PersonLinkedSeed: Federated seeds; next pilot stage.
  PersonPlatformIntegration: Third-party integrations; next pilot stage.
  PersonPlatformMembership: Platform membership and role grants; contract with the platform subsystem.
  PersonSeed: Personal seed exports; next pilot stage.

opt_in_permissions:
  create_person: Opt-in profile administration; no default role holds it.
  read_person: Opt-in read of private profiles; no default role holds it.
  update_person: Opt-in profile administration; no default role holds it.
  delete_person: Opt-in profile deletion; no default role holds it.
  list_person: Opt-in full directory listing; no default role holds it.
  manage_unclaimed_profiles: Opt-in editing of unclaimed profiles for a community's organizers; no default role holds it.

controllers:
  - better_together/people
  - better_together/person_blocks
  - better_together/api/v1/people
  - better_together/api/v1/person_blocks
controller_allowlist:
  better_together/people#index: The index action scopes through resource_collection, which calls policy_scope.

# PD-1, PD-2 and PD-5 were approved and enforced; no people decision is open.
decisions: {}

resources:
  person:
    model: BetterTogether::Person
    policy: BetterTogether::PersonPolicy
    classification: personal
    title: Person profile
    states: [public, community, private, unclaimed, claimed]
    permissions: [create_person, read_person, update_person, delete_person, list_person, manage_unclaimed_profiles]
    controllers: [better_together/people, better_together/api/v1/people]
    rules:
      - {id: self, question: "Is the actor the person themself?", on_yes: allow}
      - {id: block, question: "Has the person blocked the actor (or the actor the person)?", on_yes: deny}
      - {id: privacy_gate, question: "Is the profile effectively public?", on_yes: allow}
      - {id: unclaimed_editor, question: "Is the person unclaimed (no confirmed linked user) and the actor a platform manager or steward, or a community organizer holding manage_unclaimed_profiles?", on_yes: allow}
      - {id: shared_community, question: "Is the profile community-level and does the actor share an active community with the person?", on_yes: allow}
      - {id: directory_permission, question: "Does a custom role grant read_person or list_person?", on_yes: allow, unprobed: "No persona holds a custom role; opt-in permission."}
      - {id: member_status, question: "Is the actor a platform manager operating the member's status (not the profile)?", on_yes: allow}
      - {id: default_deny, question: "Nothing above matched", on_yes: deny}
    actions:
      index:
        states: [any]
        rows:
          - {personas: [record_owner, blocked_user], outcome: na}
          - {personas: [anonymous], outcome: deny, rule: default_deny, reason: "The directory needs a signed-in actor; the scope then filters."}
          - {outcome: allow, rule: privacy_gate, reason: "Signed-in people may open the directory; the scope filters the rows."}
      show:
        states: [public, community, private, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: self, reason: "People always read their own profile."}
          - {personas: [blocked_user], states: [public, community, private], outcome: deny, rule: block, reason: "A block hides the blocker's profile from the blocked person."}
          - {states: [public, unclaimed], outcome: allow, rule: privacy_gate, reason: "Public profiles are readable by anyone."}
          - {states: [community], personas: [community_member, community_contributor, community_organizer], outcome: allow,
             rule: shared_community, reason: "Community-level profiles are visible to people who share a community."}
          - {outcome: deny, rule: default_deny, reason: "Private profiles and profiles outside one's communities are not readable; standing roles do not read them."}
      download:
        states: [public, community, private, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: self, reason: "Download follows show."}
          - {personas: [blocked_user], states: [public, community, private], outcome: deny, rule: block, reason: "Download follows show."}
          - {states: [public, unclaimed], outcome: allow, rule: privacy_gate, reason: "Download follows show."}
          - {states: [community], personas: [community_member, community_contributor, community_organizer], outcome: allow,
             rule: shared_community, reason: "Download follows show."}
          - {outcome: deny, rule: default_deny, reason: "Download follows show."}
      create:
        states: [new]
        rows:
          - {personas: [record_owner, blocked_user], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Creating a profile needs the opt-in create_person grant; no default role holds it."}
      update:
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [platform_manager, platform_steward], states: [unclaimed], outcome: allow, rule: unclaimed_editor, reason: "An unclaimed profile has no owner; staff who may update person records maintain it."}
          - {personas: [record_owner], outcome: allow, rule: self, reason: "People edit their own profile."}
          - personas: [platform_manager, platform_steward]
            outcome: deny
            rule: default_deny
            reason: "Profile editing shows private contact details; managers operate member status, not claimed profile content."
          - {personas: [community_organizer], states: [unclaimed], outcome: deny, rule: default_deny,
             reason: "Organizers edit an unclaimed profile only with the opt-in manage_unclaimed_profiles grant; no default role holds it."}
          - {outcome: deny, rule: default_deny, reason: "Only the person (or an opt-in update_person grant) edits a claimed profile."}
      suspend:
        states: [claimed, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [platform_manager, platform_steward], outcome: allow, rule: member_status,
             reason: "Managers suspend members; this opens no profile content."}
          - {outcome: deny, rule: default_deny, reason: "Only platform managers operate member status, and nobody suspends themself."}
      restore:
        states: [claimed, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [platform_manager, platform_steward], outcome: allow, rule: member_status,
             reason: "Managers restore suspended members; this opens no profile content."}
          - {outcome: deny, rule: default_deny, reason: "Only platform managers operate member status, and nobody restores themself."}
      destroy:
        states: [public, community, private, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Deletion is a reviewed deletion request, not a policy action; the opt-in delete_person grant is held by no default role."}
      scope:
        states: [public, community, private, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: self, reason: "People list themselves."}
          - {personas: [blocked_user], states: [public, community, private], outcome: deny, rule: block, reason: "Blocks remove the blocker from the blocked person's results."}
          - {states: [public, unclaimed], outcome: allow, rule: privacy_gate, reason: "Public profiles are listed for everyone."}
          - {states: [community], personas: [community_member, community_contributor, community_organizer], outcome: allow,
             rule: shared_community, reason: "Shared-community people are listed."}
          - {outcome: deny, rule: default_deny, reason: "Other profiles are not listed; standing roles do not list private people."}

  person_block:
    model: BetterTogether::PersonBlock
    policy: BetterTogether::PersonBlockPolicy
    classification: personal
    title: Person block
    states: [own, someone_elses]
    permissions: []
    controllers: [better_together/person_blocks, better_together/api/v1/person_blocks]
    rules:
      - {id: blocker, question: "Is the actor the person who placed the block?", on_yes: allow}
      - {id: default_deny, question: "Nothing above matched", on_yes: deny}
    actions:
      index:
        states: [any]
        rows:
          - {personas: [record_owner], outcome: na}
          - {personas: [anonymous], outcome: deny, rule: default_deny, reason: "Blocking needs a signed-in actor."}
          - {outcome: allow, rule: blocker, reason: "Signed-in people open their own block list; the scope filters it."}
      show:
        rows:
          - {personas: [record_owner], states: [someone_elses], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: blocker, reason: "The blocker reads their own block."}
          - {states: [own], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Blocks are private to the blocker; nobody else reads them, including the blocked person and standing roles."}
      create:
        rows:
          - {personas: [record_owner], states: [someone_elses], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: blocker, reason: "People place their own blocks (except on platform managers)."}
          - {states: [own], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Nobody places a block on someone else's behalf."}
      destroy:
        rows:
          - {personas: [record_owner], states: [someone_elses], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: blocker, reason: "The blocker lifts their own block."}
          - {states: [own], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Only the blocker lifts a block."}
      scope:
        rows:
          - {personas: [record_owner], states: [someone_elses], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: blocker, reason: "The blocker lists their own blocks."}
          - {states: [own], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Blocks are visible to the blocker only."}

  contact_detail:
    model: BetterTogether::ContactDetail
    policy: BetterTogether::ContactDetailPolicy
    classification: personal
    title: Contact detail
    states: [public, private, unclaimed]
    permissions: []
    controllers: []
    rules:
      - {id: owner, question: "Is the actor the owner of the contactable (a claimed person themself; for an unclaimed person or another record, whoever may update it)?", on_yes: allow}
      - {id: public_owner, question: "Is the contactable effectively public and visible to the actor?", on_yes: allow}
      - {id: default_deny, question: "Nothing above matched", on_yes: deny}
    actions:
      show:
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {outcome: deny, rule: default_deny, reason: "Contact details render through their owner's profile and are never fetched directly (no show? method)."}
      create:
        states: [public, private, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [platform_manager, platform_steward], states: [unclaimed], outcome: allow, rule: owner, reason: "An unclaimed person has no owner; staff who may update the person maintain its details."}
          - {personas: [record_owner], outcome: allow, rule: owner, reason: "The owner adds contact details to their own record."}
          - {outcome: deny, rule: default_deny, reason: "Only the contactable's owner creates its contact details; standing roles do not."}
      update:
        states: [public, private, unclaimed]
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [platform_manager, platform_steward], states: [unclaimed], outcome: allow, rule: owner, reason: "An unclaimed person has no owner; staff who may update the person maintain its details."}
          - {personas: [record_owner], outcome: allow, rule: owner, reason: "The owner edits their own contact details."}
          - {outcome: deny, rule: default_deny, reason: "Only the owner edits contact details; standing roles do not."}
      destroy:
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [platform_manager, platform_steward], states: [unclaimed], outcome: allow, rule: owner, reason: "An unclaimed person has no owner; staff who may update the person maintain its details."}
          - {personas: [record_owner], outcome: allow, rule: owner, reason: "The owner removes their own contact detail."}
          - {outcome: deny, rule: default_deny, reason: "Only the owner removes a contact detail; standing roles do not."}
      scope:
        rows:
          - {personas: [record_owner], states: [unclaimed], outcome: na}
          - {personas: [record_owner], outcome: allow, rule: owner, reason: "Owners list their own contact details."}
          - {states: [public, unclaimed], outcome: allow, rule: public_owner, reason: "A public profile's contact detail container is listed to everyone."}
          - {outcome: deny, rule: default_deny, reason: "A private person's contact detail is personal data visible to the person only, never to standing roles."}
