name: Compat Branch Sync PRs

# Keeps compat/rails-* aligned with main. For each compat branch this builds
# `sync/main-to-<compat branch>` (the compat tip with main merged in), opens a
# PR from it, and enables auto-merge. The compat ruleset requires `ci-gate`.
#
# Pushes and PRs made with GITHUB_TOKEN do not trigger CI, so this uses the
# COMPAT_SYNC_TOKEN secret (fine-grained PAT owned by bts-robot: Contents,
# Pull requests and Workflows read/write on this repo). Rotate before expiry.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-branch-sync
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch:
          - compat/rails-7.2
          - compat/rails-8.0
          - compat/rails-8.1
    env:
      TARGET_BRANCH: ${{ matrix.target_branch }}
      GH_TOKEN: ${{ secrets.COMPAT_SYNC_TOKEN }}
    steps:
      - name: Require sync token
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Secret COMPAT_SYNC_TOKEN is not set; sync PRs would not get CI."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.COMPAT_SYNC_TOKEN }}

      - name: Build sync branch
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sync_branch="sync/main-to-${TARGET_BRANCH//\//-}"
          echo "sync_branch=${sync_branch}" >> "${GITHUB_OUTPUT}"

          if ! git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null; then
            echo "::notice::Skipping ${TARGET_BRANCH}: branch does not exist yet."
            echo "action=skip" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch origin "${TARGET_BRANCH}" main
          if git merge-base --is-ancestor origin/main "origin/${TARGET_BRANCH}"; then
            echo "::notice::${TARGET_BRANCH} already contains main."
            echo "action=skip" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${sync_branch}" "origin/${TARGET_BRANCH}"
          if ! git merge --no-ff origin/main -m "chore(compat): merge main into ${TARGET_BRANCH}"; then
            git merge --abort || true
            echo "::error::Merging main into ${TARGET_BRANCH} conflicts. Resolve it by hand on a branch off ${TARGET_BRANCH}."
            exit 1
          fi

          # Skip the push (and the CI re-run) when the remote sync branch is
          # already the merge of the same two tips.
          if git fetch origin "${sync_branch}" 2>/dev/null \
            && [[ "$(git rev-parse "origin/${sync_branch}^1" 2>/dev/null)" == "$(git rev-parse "origin/${TARGET_BRANCH}")" ]] \
            && [[ "$(git rev-parse "origin/${sync_branch}^2" 2>/dev/null)" == "$(git rev-parse origin/main)" ]]; then
            echo "::notice::${sync_branch} is already current."
            echo "action=reuse" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git push --force origin "${sync_branch}"
          echo "action=pushed" >> "${GITHUB_OUTPUT}"

      - name: Open PR if none exists
        if: steps.build.outputs.action == 'pushed' || steps.build.outputs.action == 'reuse'
        shell: bash
        env:
          SYNC_BRANCH: ${{ steps.build.outputs.sync_branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "::notice::Sync PR already open for ${TARGET_BRANCH}: #${existing}"
          else
            body="$(cat <<EOF
          ## Summary

          Automated sync of \`main\` into \`${TARGET_BRANCH}\`, built on \`${SYNC_BRANCH}\`.

          ## How this merges

          - The Ruby on Rails CI workflow runs on this PR (Rails lane for \`${TARGET_BRANCH}\`).
          - Auto-merge (merge commit, so history stays aligned) is enabled; GitHub merges once the checks required by the compat ruleset pass.
          - If the merge conflicts or CI fails, nothing merges: fix it on \`${SYNC_BRANCH}\`.
          EOF
            )"
            gh pr create --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" \
              --title "chore(compat): merge main into ${TARGET_BRANCH}" \
              --body "${body}"
          fi

      - name: Enable auto-merge
        if: steps.build.outputs.action == 'pushed' || steps.build.outputs.action == 'reuse'
        shell: bash
        env:
          SYNC_BRANCH: ${{ steps.build.outputs.sync_branch }}
        run: |
          # Needs the compat ruleset (required checks); without it GitHub
          # refuses. Warn rather than fail.
          gh pr merge --auto --merge "${SYNC_BRANCH}" \
            || echo "::warning::Could not enable auto-merge on ${SYNC_BRANCH}. Check the compat ruleset and the repo auto-merge setting."
