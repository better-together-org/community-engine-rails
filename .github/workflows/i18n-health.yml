name: i18n Translation Health Report

on:
  push:
    branches:
      - main
      - dev
      - compat/rails-7.2
      - compat/rails-8.0
      - compat/rails-8.1
  pull_request:
    # Run on PRs targeting any branch so feature/fix/salvage branches get the
    # same locale-health coverage as rubocop/rspec. Non-compat targets default
    # to the primary Rails lane in prepare.
    branches:
      - "**"

jobs:
  prepare:
    # Skip automated compat sync PRs (main → compat/*) whose head_ref == 'main'.
    # The i18n-health job cascades-skip via needs: prepare.
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    outputs:
      rails_version: ${{ steps.branch-target.outputs.rails_version }}
    steps:
      - name: Resolve native Rails lane
        id: branch-target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            branch="${GITHUB_BASE_REF}"
          else
            branch="${GITHUB_REF_NAME}"
          fi

          case "${branch}" in
            compat/rails-7.2)
              rails_version="7.2.4"
              ;;
            compat/rails-8.0)
              rails_version="8.0.5.1"
              ;;
            main|dev|compat/rails-8.1)
              rails_version="8.1.4"
              ;;
            *)
              rails_version="8.1.4"
              ;;
          esac

          echo "rails_version=${rails_version}" >> "${GITHUB_OUTPUT}"

  i18n-health:
    needs: prepare
    runs-on: ubuntu-latest
    # The auto-fix commits to the branch tip, so only the newest push's run may proceed.
    concurrency:
      group: i18n-health-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      HAS_PUSH_TOKEN: ${{ secrets.BTS_ROBOT_PUSH_TOKEN != '' }}
      # Ensure dev/test gems (incl. i18n-tasks) are installed
      BUNDLE_WITHOUT: ""
      BUNDLE_WITH: "development:test"
      RAILS_VERSION: ${{ needs.prepare.outputs.rails_version }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.BTS_ROBOT_PUSH_TOKEN || github.token }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          # Ensure bundler installs dev/test groups during caching step
          BUNDLE_WITHOUT: ""
          BUNDLE_WITH: "development:test"
        with:
          ruby-version: '3.4.12'
      - name: Resolve branch-native bundle
        shell: bash
        run: |
          bundle config set deployment false
          bundle update rails --conservative
          bundle install --jobs 4 --retry 3
      - name: Verify i18n-tasks
        run: bundle exec i18n-tasks --version
      - name: Normalize locale files
        id: normalize
        run: |
          bin/i18n normalize
          if git diff --quiet -- config/locales; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- config/locales
          fi
      # Normalizing is deterministic, so commit it back instead of leaving the branch unnormalized.
      # Compat lanes (base or branch compat/*) normalize under an older Rails, so they never commit.
      - name: Commit normalized locale files (GitHub-signed)
        id: autofix
        if: >-
          steps.normalize.outputs.changed == 'true'
          && env.HAS_PUSH_TOKEN == 'true'
          && github.ref_name != github.event.repository.default_branch
          && !startsWith(github.base_ref, 'compat/')
          && !startsWith(github.ref_name, 'compat/')
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.BTS_ROBOT_PUSH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          bin/ci-signed-commit "chore(i18n): normalize locale files" config/locales
      - name: Warn that normalization was not committed
        if: steps.normalize.outputs.changed == 'true' && steps.autofix.outcome != 'success'
        run: |
          echo "::warning::Locale files are not normalized. Run bin/i18n normalize and commit config/locales."
      - name: Run i18n checks
        run: bin/i18n check
      - name: Upload i18n health report
        if: always()
        run: bin/i18n health > i18n-health.txt
        continue-on-error: true
      - name: Archive i18n health report
        uses: actions/upload-artifact@v7
        with:
          name: i18n-health-report
          path: i18n-health.txt
