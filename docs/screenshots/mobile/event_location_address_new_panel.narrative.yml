journey_step: As an event organizer, if the venue address isn't in the system yet,
  I add it right here instead of being sent to a separate address-management screen
  first.
callouts:
- :id: new_address_button
  :title: '"+ New" trigger'
  :description: 'Only shown when the organizer has permission to create addresses
    (Pundit-gated). Settlement and Region have no equivalent button — they are curated
    reference data, chosen from the existing list only, never created here. Changed
    in this PR: previously only appeared after selecting the matching radio — a user
    reaches for "+New" precisely when nothing in search matches, so it is now always
    available regardless of what the picker currently holds.'
- :id: new_address_panel
  :title: Inline creation fields
  :description: Picking an existing location, or typing a new simple name, automatically
    closes this panel and disables its fields again so they never compete with the
    just-picked location on submit.
accessibility_notes: The "+ New" control is a real link with visible focus state;
  the revealed panel receives programmatic focus on its first field when opened.
