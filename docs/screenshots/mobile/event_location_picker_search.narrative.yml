---
title: Event Form — Mixed-Search Location Picker
audience:
- event_organizer
- community_organizer
- developer
journey_step: As an event organizer, I type a few letters of the venue name and see
  matching addresses, buildings, and curated places together in one list, instead
  of first having to know and pick which kind of location it is.
callouts:
- :id: location_picker
  :title: Mixed-type search
  :description: EventsController#available_locations searches every Geography::Placeable
    type at once when no location_type is given, returning composite "ClassName:id"
    values so one merged, type-labeled result list can span types without id collisions.
    The allow-list is read from Placeable.included_in_models, so a future new location
    type is searched here automatically with no view change.
accessibility_notes: The field has a single "Location" label and one hint wired via
  aria-describedby. The combobox is keyboard-operable (type-ahead, arrow keys, Enter
  to select) and exposes role="combobox" to assistive technology.
slug: event_location_picker_search
device: mobile
