# Curated user and operator workflows. Names must match live controllers and models; the generator fails on unknown names.
# Edit this file to add workflows, then run bin/export_documentation_coverage_manifest.
workflows:
  - id: person_data_export_and_deletion
    title: "Person data export and deletion"
    audiences: [end_user, content_moderator]
    controllers:
      - BetterTogether::PersonDataExportsController
      - BetterTogether::PersonDeletionRequestsController
    models:
      - BetterTogether::PersonDataExport
      - BetterTogether::PersonDeletionRequest
      - BetterTogether::PersonPurgeAudit
  - id: safety_reporting_and_case_review
    title: "Safety reporting and case review"
    audiences: [end_user, content_moderator]
    controllers:
      - BetterTogether::ReportsController
      - BetterTogether::ReportFollowupsController
      - BetterTogether::Safety::CasesController
      - BetterTogether::Safety::ActionsController
      - BetterTogether::Safety::NotesController
      - BetterTogether::Safety::AgreementsController
    models:
      - BetterTogether::Report
      - BetterTogether::Safety::Case
      - BetterTogether::Safety::Action
      - BetterTogether::Safety::Note
      - BetterTogether::Safety::Agreement
  - id: invitations_and_membership_requests
    title: "Invitations and membership requests"
    audiences: [community_organizer, end_user]
    controllers:
      - BetterTogether::InvitationsController
      - BetterTogether::PlatformInvitationsController
      - BetterTogether::MembershipRequestsController
      - BetterTogether::PersonCommunityMembershipsController
    models:
      - BetterTogether::Invitation
      - BetterTogether::PlatformInvitation
      - BetterTogether::Joatu::MembershipRequest
      - BetterTogether::PersonCommunityMembership
  - id: platform_connections_and_federation
    title: "Platform connections and federation"
    audiences: [platform_manager]
    controllers:
      - BetterTogether::PlatformConnectionsController
      - BetterTogether::FederationHubController
      - BetterTogether::Federation::LinkedSeedsController
      - BetterTogether::PersonLinkedSeedsController
    models:
      - BetterTogether::PlatformConnection
      - BetterTogether::FederationAccessToken
      - BetterTogether::FederationContentGrant
      - BetterTogether::PersonLinkedSeed
  - id: inbound_email_screening
    title: "Inbound email screening"
    audiences: [platform_manager, content_moderator]
    controllers:
      - BetterTogether::InboundEmailsController
    models:
      - BetterTogether::InboundEmailMessage
      - BetterTogether::InboundEmailReplyToken
      - BetterTogether::ContentSecurity::Subject
  - id: content_security_review
    title: "Content security review"
    audiences: [platform_manager, content_moderator]
