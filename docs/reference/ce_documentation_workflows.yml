      - BetterTogether::UploadsController
    models:
      - BetterTogether::ContentSecurity::Finding
      - BetterTogether::ContentSecurity::Item
      - BetterTogether::ContentSecurity::ScanEvent
      - BetterTogether::ContentSecurity::Subject
