      - BetterTogether::Agreement
      - BetterTogether::AgreementParticipant
      - BetterTogether::AgreementTerm
  - id: robots_and_authorship
    title: "Robots and authorship"
    audiences: [platform_manager, developer]
    controllers:
      - BetterTogether::RobotsController
    models:
      - BetterTogether::Robot
      - BetterTogether::Authorship
  - id: cms_pages_and_blocks
    title: "Pages and content blocks"
    audiences: [platform_manager]
    controllers:
      - BetterTogether::PagesController
      - BetterTogether::Content::BlocksController
      - BetterTogether::Content::PageBlocksController
